# MarsNav web demo: publishes the browser app (app/) on GitHub Pages, so anyone can open the EVA planner, the visor HUD
# and the rover drive window from a link, with nothing to install. Landing mode needs the Python server (it streams and
# processes NASA / USGS data for any place on Mars); on the web copy it says so and links the Windows download.
# One-time set-up on GitHub, if this workflow reports that Pages is not enabled: Settings > Pages > Source: GitHub Actions.
name: Web demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish app/ to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check the planner's files are all present
        # every module the planner imports must be in app/ (the web copy has no server to fall back on)
        run: node tools/check_web_demo_files.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
