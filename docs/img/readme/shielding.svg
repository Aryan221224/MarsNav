<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Barlow, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="520" rx="14" fill="#0b0f14"/><text x="40" y="48" font-size="26" font-weight="700" fill="#f2f5f8">Terrain radiation shielding vs Curiosity RAD</text><text x="40" y="76" font-size="16" fill="#96a2b0">By a Murray Butte that hid 19 % of the sky, RAD measured about -4 % dose. MarsNav's formula for walls that hide the same share of sky:</text><line x1="110" y1="110.0" x2="1150" y2="110.0" stroke="#28323e"/><text x="98" y="115.0" font-size="14" fill="#96a2b0" text-anchor="end">0 %</text><line x1="110" y1="165.0" x2="1150" y2="165.0" stroke="#28323e"/><text x="98" y="170.0" font-size="14" fill="#96a2b0" text-anchor="end">-3 %</text><line x1="110" y1="220.0" x2="1150" y2="220.0" stroke="#28323e"/><text x="98" y="225.0" font-size="14" fill="#96a2b0" text-anchor="end">-6 %</text><line x1="110" y1="275.0" x2="1150" y2="275.0" stroke="#28323e"/><text x="98" y="280.0" font-size="14" fill="#96a2b0" text-anchor="end">-9 %</text><line x1="110" y1="330.0" x2="1150" y2="330.0" stroke="#28323e"/><text x="98" y="335.0" font-size="14" fill="#96a2b0" text-anchor="end">-12 %</text><line x1="110" y1="385.0" x2="1150" y2="385.0" stroke="#28323e"/><text x="98" y="390.0" font-size="14" fill="#96a2b0" text-anchor="end">-15 %</text><line x1="110" y1="440.0" x2="1150" y2="440.0" stroke="#28323e"/><text x="98" y="445.0" font-size="14" fill="#96a2b0" text-anchor="end">-18 %</text><text x="110.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">20°</text><text x="214.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">25°</text><text x="318.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">30°</text><text x="422.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">35°</text><text x="526.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">40°</text><text x="734.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">50°</text><text x="942.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">60°</text><text x="1150.0" y="466" font-size="14" fill="#96a2b0" text-anchor="middle">70°</text><text x="630.0" y="494" font-size="15" fill="#96a2b0" text-anchor="middle">height of the wall (elevation angle), azimuth width set so 19 % of the sky is hidden</text><rect x="110" y="165.0" width="1040" height="36.7" fill="#d8a57a" opacity="0.18"/><line x1="110" y1="183.3" x2="1150" y2="183.3" stroke="#d8a57a" stroke-width="2" stroke-dasharray="8 6"/><text x="1142" y="173.3" font-size="16" fill="#d8a57a" text-anchor="end">RAD measured ≈ -4 %</text><polyline points="110.0,134.6 214.0,156.9 318.0,179.3 422.0,201.1 526.0,222.0 734.0,260.3 942.0,292.2 1150.0,316.1" fill="none" stroke="#3ee07e" stroke-width="4" stroke-linejoin="round"/><circle cx="110.0" cy="134.6" r="5" fill="#3ee07e"/><circle cx="214.0" cy="156.9" r="5" fill="#3ee07e"/><circle cx="318.0" cy="179.3" r="5" fill="#3ee07e"/><circle cx="422.0" cy="201.1" r="5" fill="#3ee07e"/><circle cx="526.0" cy="222.0" r="5" fill="#3ee07e"/><circle cx="734.0" cy="260.3" r="5" fill="#3ee07e"/><circle cx="942.0" cy="292.2" r="5" fill="#3ee07e"/><circle cx="1150.0" cy="316.1" r="5" fill="#3ee07e"/><polyline points="110.0,189.6 214.0,217.6 318.0,245.7 422.0,273.0 526.0,299.2 734.0,347.4 942.0,387.4 1150.0,417.4" fill="none" stroke="#ff7470" stroke-width="4" stroke-linejoin="round"/><circle cx="110.0" cy="189.6" r="5" fill="#ff7470"/><circle cx="214.0" cy="217.6" r="5" fill="#ff7470"/><circle cx="318.0" cy="245.7" r="5" fill="#ff7470"/><circle cx="422.0" cy="273.0" r="5" fill="#ff7470"/><circle cx="526.0" cy="299.2" r="5" fill="#ff7470"/><circle cx="734.0" cy="347.4" r="5" fill="#ff7470"/><circle cx="942.0" cy="387.4" r="5" fill="#ff7470"/><circle cx="1150.0" cy="417.4" r="5" fill="#ff7470"/><rect x="124" y="370" width="14" height="14" fill="#3ee07e"/><text x="146" y="382" font-size="15" fill="#f2f5f