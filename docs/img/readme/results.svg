<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="496" viewBox="0 0 1200 496" font-family="Barlow, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="496" rx="14" fill="#0b0f14"/><text x="40" y="48" font-size="26" font-weight="700" fill="#f2f5f8">Checked, with 95 % intervals</text><text x="40" y="76" font-size="16" fill="#96a2b0">Points: measured share. Bars: 95 % interval (Clopper-Pearson for the 40 EVAs, Wilson for the rest). Exact sign test on the paired EVAs: p = 9.3e-10</text><line x1="560.0" y1="86" x2="560.0" y2="406" stroke="#28323e"/><text x="560.0" y="430" font-size="14" fill="#96a2b0" text-anchor="middle">0 %</text><line x1="707.5" y1="86" x2="707.5" y2="406" stroke="#28323e"/><text x="707.5" y="430" font-size="14" fill="#96a2b0" text-anchor="middle">25 %</text><line x1="855.0" y1="86" x2="855.0" y2="406" stroke="#28323e"/><text x="855.0" y="430" font-size="14" fill="#96a2b0" text-anchor="middle">50 %</text><line x1="1002.5" y1="86" x2="1002.5" y2="406" stroke="#28323e"/><text x="1002.5" y="430" font-size="14" fill="#96a2b0" text-anchor="middle">75 %</text><line x1="1150.0" y1="86" x2="1150.0" y2="406" stroke="#28323e"/><text x="1150.0" y="430" font-size="14" fill="#96a2b0" text-anchor="middle">100 %</text><text x="40" y="110" font-size="17" fill="#f2f5f8">Closed loop: crews that dipped into the reserve</text><text x="40" y="132" font-size="15" fill="#96a2b0">0 of 40  ·  95 % CI 0–9 %</text><line x1="560.0" y1="114" x2="611.9" y2="114" stroke="#3ee07e" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="560.0" cy="114" r="9" fill="#3ee07e"/><text x="40" y="176" font-size="17" fill="#f2f5f8">Same EVAs flown on the fixed plan</text><text x="40" y="198" font-size="15" fill="#96a2b0">31 of 40  ·  95 % CI 62–89 %</text><line x1="922.9" y1="180" x2="1086.3" y2="180" stroke="#ff7470" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="1017.2" cy="180" r="9" fill="#ff7470"/><text x="40" y="242" font-size="17" fill="#f2f5f8">Rover's real path safer than the straight line (JPL's choices)</text><text x="40" y="264" font-size="15" fill="#96a2b0">21 of 30  ·  95 % CI 52–83 %</text><line x1="867.4" y1="246" x2="1051.5" y2="246" stroke="#3ccbff" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="973.0" cy="246" r="9" fill="#3ccbff"/><text x="40" y="308" font-size="17" fill="#f2f5f8">Walking slope at or above the rover's measured tilt</text><text x="40" y="330" font-size="15" fill="#96a2b0">356 of 480  ·  95 % CI 70–78 %</text><line x1="973.6" y1="312" x2="1019.6" y2="312" stroke="#3ccbff" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="997.8" cy="312" r="9" fill="#3ccbff"/><text x="40" y="374" font-size="17" fill="#f2f5f8">False no-go at real Perseverance positions</text><text x="40" y="396" font-size="15" fill="#96a2b0">12 of 703  ·  95 % CI 1–3 %</text><line x1="565.9" y1="378" x2="577.7" y2="378" stroke="#3ccbff" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="570.0" cy="378" r="9" fill="#3ccbff"/></svg>
